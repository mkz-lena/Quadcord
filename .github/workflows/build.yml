name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and install bannertool
        run: |
          set -eux

          mkdir -p /tmp/cmake /tmp/bannertool-src
          curl --fail --location --silent --show-error \
            https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-linux-x86_64.tar.gz \
            -o /tmp/cmake.tar.gz
          tar -xzf /tmp/cmake.tar.gz --strip-components=1 -C /tmp/cmake

          curl --fail --location --silent --show-error \
            https://github.com/carstene1ns/3ds-bannertool/archive/refs/tags/1.2.3.tar.gz \
            -o /tmp/bannertool.tar.gz
          tar -xzf /tmp/bannertool.tar.gz --strip-components=1 -C /tmp/bannertool-src

          /tmp/cmake/bin/cmake -S /tmp/bannertool-src -B /tmp/bannertool-build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/bt
          /tmp/cmake/bin/cmake --build /tmp/bannertool-build --parallel
          /tmp/cmake/bin/cmake --install /tmp/bannertool-build
          test -x /tmp/bt/bin/bannertool
          echo /tmp/bt/bin >> "$GITHUB_PATH"

      - name: Install 3DS packaging tools
        run: |
          set -eux
          dkp-pacman -S --needed --noconfirm 3ds-cia-tools 3ds-smdhtool

      - name: Build
        env:
          DEVKITARM: /opt/devkitpro/devkitARM
          PATH: /tmp/bt/bin:/opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:/usr/bin:/bin
        run: |
          command -v makerom
          command -v smdhtool
          make -j"$(nproc)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Quadcord-build
          path: |
            Quadcord.3dsx
            Quadcord.cia
            Quadcord.elf

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Quadcord-build
          path: ./
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Quadcord.3dsx
            Quadcord.cia
          generate_release_notes: true
