name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bannertool
        run: |
          mkdir -p /tmp/bt
          curl -sL "https://github.com/carstene1ns/3ds-bannertool/releases/download/1.2.3/bannertool-1.2.3-linux.tar.gz" -o /tmp/bt/bt.tar.gz
          tar -xzf /tmp/bt/bt.tar.gz -C /tmp/bt
          find /tmp/bt -name bannertool -type f -exec chmod +x {} \;
          BTDIR=$(dirname $(find /tmp/bt -name bannertool -type f | head -1))
          echo "$BTDIR" >> $GITHUB_PATH
          export PATH="$BTDIR:$PATH"
          ls /tmp/bt
          which bannertool || find /tmp/bt -name bannertool

      - name: Build
        env:
          DEVKITARM: /opt/devkitpro/devkitARM
          PATH: /tmp/bt:/opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:/usr/bin:/bin
        run: |
          make -j$(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Quadcord-build
          path: |
            Quadcord.3dsx
            Quadcord.cia
            Quadcord.elf

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Quadcord-build
          path: ./
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Quadcord.3dsx
            Quadcord.cia
          generate_release_notes: true