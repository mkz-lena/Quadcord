name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup devkitPro
        run: |
          sudo wget https://pkg.devkitpro.org/debian/devkitpro.gpg -O /usr/share/keyrings/devkitpro.gpg
          echo "deb [signed-by=/usr/share/keyrings/devkitpro.gpg] https://pkg.devkitpro.org/packages stable main" | sudo tee /etc/apt/sources.list.d/devkitpro.list
          sudo apt-get update
          sudo apt-get install -y devkitpro-pacman 3ds-dev 3ds-curl 3ds-zlib 3ds-mbedtls 3ds-minizip
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV
          echo "/opt/devkitpro/tools/bin" >> $GITHUB_PATH
          echo "/opt/devkitpro/devkitARM/bin" >> $GITHUB_PATH

      - name: Install bannertool
        run: |
          mkdir -p /tmp/bt
          curl -sL "https://github.com/Steveice10/bannertool/releases/download/1.2.0/bannertool-1.2.0-linux.zip" -o /tmp/bt/bt.zip || true
          cd /tmp/bt && (unzip -o bt.zip 2>/dev/null || true)
          ls /tmp/bt
          export PATH="/tmp/bt:$PATH"
          which bannertool || echo "bannertool not found, build may fail"

      - name: Build
        env:
          DEVKITARM: /opt/devkitpro/devkitARM
          PATH: /tmp/bt:/opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:/usr/bin:/bin
        run: |
          make -j$(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Quadcord-build
          path: |
            Quadcord.3dsx
            Quadcord.cia
            Quadcord.elf

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Quadcord-build
          path: ./
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Quadcord.3dsx
            Quadcord.cia
          generate_release_notes: true